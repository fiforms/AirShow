# Settings for airshow-kiosk (AirShow underneath a fullscreen kiosk browser).
# Per-user overrides go in ~/.config/airshow/kiosk.conf (same format).
# Read by /bin/sh: quote values that contain spaces.

# Page the kiosk browser shows while nobody is casting.
KIOSK_URL="about:blank"

# Full browser command, replacing the default
#   chromium --kiosk --ozone-platform=wayland --noerrdialogs \
#            --disable-infobars --no-first-run "$KIOSK_URL"
#BROWSER_COMMAND="chromium --kiosk --ozone-platform=wayland https://example.org/signage"

# Extra command-line options for AirShow, e.g. "--no-beacon".
AIRSHOW_ARGS=""
